[workspace]
members = ["xtask"]
resolver = "3"

[package]
name = "score-set"
version = "0.3.0"
edition = "2024"
description = "A Rust library for building static weighted scoring operator sets"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jcfangc/score-set"
keywords = ["scoring", "weighted", "metric", "static", "score"]
categories = ["algorithms", "science"]
exclude = [
    "src/lab.rs",
    "src/**/tests_for_*.rs",
]

[dependencies]
witnessed = "0.8.0"

# Enables f64-based scoring types (default: f32).
# Run `cargo run -p xtask -- gen` to regenerate src/metric_f64.rs.
[features]
f64 = []
